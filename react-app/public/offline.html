<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — The Drawing Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1B1B17;
      --paper: #F5F2EC;
      --card: #EFEBE2;
      --pine: #2A5C45;
      --marker: #A19071;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .logo-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 48px;
    }
    .offline-code {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--marker);
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 600;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 16px;
    }
    p {
      font-size: 14px;
      color: #4C4739;
      line-height: 1.65;
      max-width: 460px;
      margin: 0 auto 36px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 13px 28px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--pine); }
    .divider {
      width: 64px;
      height: 1px;
      background: var(--marker);
      margin: 40px auto;
    }
    .note {
      font-size: 11px;
      color: var(--marker);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="logo-mark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="28 138 290 56" style="height:38px;width:auto;display:block;">
      <rect x="30.445" y="142.642" fill="#A19071" width="44.42" height="25.732"/>
      <rect x="30.445" y="159.392" fill="#A19071" width="22.685" height="30.341"/>
      <text transform="matrix(1 0 0 1 78.917 167.3428)" fill="#1B1B17" font-family="Georgia,serif" font-size="22.8942">THE DRAWING BOARD</text>
      <text transform="matrix(1 0 0 1 148.7827 187.6387)" fill="#A19071" font-family="monospace" font-size="11.0941" letter-spacing="1px">CREATIVE AGENCY</text>
    </svg>
  </div>

  <div class="offline-code">// OFFLINE MODE // NO NETWORK DETECTED</div>

  <h1>You're currently<br />offline.</h1>

  <p>
    It seems you've lost your internet connection. Check your network and try reloading — our studio work, case studies, and contact forms will be right here when you're back.
  </p>

  <button class="btn" onclick="window.location.reload()">
    Try Again →
  </button>

  <div class="divider"></div>

  <p class="note">THE DRAWING BOARD — STRATEGY-FIRST DESIGN STUDIO</p>
</body>
</html>
